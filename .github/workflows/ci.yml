name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq dash shellcheck iverilog
      - name: spec, generator, conformance, manifest, loader, launcher, renderer, registry, SV
        run: sh tests/run_all.sh
      - name: generated headers compile as C11 and C++17
        run: |
          cc  -std=c11   -Wall -Wextra -Werror -Ispec/generated tests/smoke_profiles.c -o t && ./t
          c++ -std=c++17 -Wall -Wextra -Werror -Ispec/generated -x c++ tests/smoke_profiles.c -o t && ./t

  docker-base:
    runs-on: ubuntu-latest
    needs: host-tests
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and load
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.base
          load: true
          tags: mister-armhf-base:bullseye
      - name: cross-compile smoke test
        run: |
          docker run --rm -v "$PWD:/src" -w /src mister-armhf-base:bullseye sh -ec '
            arm-linux-gnueabihf-gcc -std=c11 -Wall -Werror -mcpu=cortex-a9 -mfpu=neon -mfloat-abi=hard \
              -Ispec/generated tests/smoke_profiles.c -o /tmp/t
            file /tmp/t | grep -q "ARM, EABI5" && echo armhf-ok'
      - name: build MiSTer_hybrid against upstream Main_MiSTer
        run: device/main-hook/build-hps.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MiSTer_hybrid
          path: build/main-hook/MiSTer_hybrid
      - name: push to GHCR (main / tags)
        if: github.event_name == 'push'
        run: |
          for t in bullseye ${{ github.sha }}; do
            docker tag mister-armhf-base:bullseye ghcr.io/${{ github.repository_owner }}/mister-armhf-base:$t
            docker push -q ghcr.io/${{ github.repository_owner }}/mister-armhf-base:$t
          done
